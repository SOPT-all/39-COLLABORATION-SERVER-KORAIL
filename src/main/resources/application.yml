spring:
  application:
    name: korail

  profiles:
    default: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

# dev 는 dev/.env, prod 는 GitHub 변수(CORS_ALLOWED_ORIGINS)에서 주입된다 (쉼표로 구분)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
