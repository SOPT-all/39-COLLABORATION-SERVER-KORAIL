spring:
  application:
    name: korail

  config:
    import: optional:file:dev/.env[.properties]

  datasource:
    url: jdbc:mysql://localhost:3306/sopt_korail
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}