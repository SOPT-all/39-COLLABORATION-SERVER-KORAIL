name: dev-sopt-korail

services:
  mysql:
    image: mysql:8.0
    container_name: sopt-korail-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: sopt_korail
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: