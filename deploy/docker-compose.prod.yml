name: sopt-korail

services:
  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: "prod"
      DB_URL: "jdbc:mysql://mysql:3306/sopt_korail"
      DB_USERNAME: "sopt_korail"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks: [edge, db]
    labels:
      caddy: ${API_DOMAIN}
      caddy.reverse_proxy: "{{upstreams 8080}}"
      caddy.encode: zstd gzip

networks:
  edge:
    external: true
  db:
    external: true
